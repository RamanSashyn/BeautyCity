name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beautycity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beautycity
      YANDEX_GEOCODE_KEY: ci
      YANDEX_STATICMAP_KEY: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Ruff, проверка кода
        run: ruff check .

      - name: Ruff, проверка форматирования
        run: ruff format --check .

      - name: Проверка настроек Django
        run: python manage.py check

      - name: Проверка миграций
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты и покрытие
        run: pytest --cov=api --cov-report=term-missing --cov-fail-under=70
